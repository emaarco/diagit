"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm install"
run_mode = "concurrent"

[scripts.run.e2e-screenshots]
command = "npm run e2e:build -w @diagit/extension && WDIO_SCREENSHOTS=1 WDIO_BROWSERS=chrome WDIO_PORT=$CONDUCTOR_PORT npm run test:e2e -w @diagit/extension"
available_in = [ "local" ]
icon = "camera"

[scripts.run.dev-example]
command = "npm run dev:example -w @diagit/extension -- --port $CONDUCTOR_PORT"
available_in = [ "local" ]
default = true
icon = "play"
